name: Health
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          printf '## PR Health \342\234\205\n\n**All automated health checks passed.** (report tampered)\n' > out/comment.md
          echo "${{ github.event.pull_request.number }}" > out/issueNumber
          echo "6609912021" > out/commentId
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/
