name: Health
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          printf '## PR Health\n\nupstream artifact from the trusted Health run\n' > out/comment.md
          echo "${{ github.event.pull_request.number }}" > out/issueNumber
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/
